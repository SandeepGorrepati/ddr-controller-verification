name: Memory regression
on:
  push:
    paths: ['rtl/**', 'tb/**', 'scripts/**', '.github/workflows/**', 'formal/**']
  pull_request:
    paths: ['rtl/**', 'tb/**', 'scripts/**', '.github/workflows/**', 'formal/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Modular directed environment
        run: python3 scripts/run_regression.py
      - name: Pipelined traffic against independent oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gen_stress.py
          iverilog -g2012 -s tb_stress -o build/stress rtl/ddr_controller.sv tb/ddr_assertions.sv tb/tb_stress.sv
          vvp build/stress | tee proof/stress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-evidence
          path: proof/*.log
